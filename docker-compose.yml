# Local infrastructure only. Run the apps with npm scripts (see README).
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: observeiq
      POSTGRES_PASSWORD: observeiq
      POSTGRES_DB: observeiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observeiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
