services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: observeiq
      POSTGRES_PASSWORD: observeiq
      POSTGRES_DB: observeiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: observeiq
      RABBITMQ_DEFAULT_PASS: observeiq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI

volumes:
  postgres_data: