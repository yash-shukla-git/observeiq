services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: observeiq
      POSTGRES_PASSWORD: observeiq
      POSTGRES_DB: observeiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  collector:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
    ports:
      - "4318:4318"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      QUEUE_NAME: spans
    depends_on:
      - postgres
    restart: always

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data: